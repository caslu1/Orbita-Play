name: Build Orbita Play APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        type: choice
        default: SideloadDebug
        options: [SideloadDebug, SideloadRelease]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build configuration
        env:
          TMDB: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp secrets.defaults.properties secrets.properties
          # Chave do TMDB opcional: Settings › Secrets › Actions › TMDB_API_KEY
          if [ -n "$TMDB" ]; then sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB|" secrets.properties; fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ inputs.variant || 'SideloadDebug' }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitaPlay-${{ inputs.variant || 'SideloadDebug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Link direto e fixo do APK:
      # https://github.com/caslu1/Orbita-Play/releases/download/apk/OrbitaPlay.apk
      - name: Publish direct APK link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(find app/build/outputs/apk -name '*.apk' | head -n 1)" OrbitaPlay.apk
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk --prerelease --target "$GITHUB_SHA" \
              --title "Orbita Play - APK de teste" \
              --notes "APK gerado automaticamente a cada atualização da branch main."
          fi
          gh release upload apk OrbitaPlay.apk --clobber
