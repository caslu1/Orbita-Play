name: Build Orbita Play APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build"
        type: choice
        default: SideloadDebug
        options: [SideloadDebug, SideloadRelease]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Placeholder build configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ inputs.variant || 'SideloadDebug' }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitaPlay-${{ inputs.variant || 'SideloadDebug' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
